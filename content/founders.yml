founders:
  - name: David Levinsohn
    role: Co-Founder
    handle: bigzzshots
    photo: /assets/img/2025/08/david.jpg
    bio: David co-founded Footy Daily Network to put a spotlight on the game at every level — from local youth and high school matches to the pros. Behind the camera as @bigzzshots, he captures the moments that never make the scoreline.
  - name: Andrew Khai
    role: Co-Founder
    handle: andrewkhaiifilmz
    photo: /assets/img/2025/08/andrewkhaiifilmz.jpg
    bio: Andrew co-founded Footy Daily Network and is the voice behind most of our match reports. Shooting as @andrewkhaiifilmz, he covers matches across MLS, NWSL, MLS NEXT Pro, USL and beyond — telling the story of each game in words and pictures.
