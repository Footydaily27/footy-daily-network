# Footy Daily Network editor (Decap CMS) — https://decapcms.org/docs/
backend:
  name: github
  repo: Footydaily27/footy-daily-network
  branch: main
  commit_messages:
    create: "New story: {{slug}}"
    update: "Update {{collection}}: {{slug}}"
    delete: "Delete {{collection}}: {{slug}}"
    uploadMedia: "Upload photo {{path}}"

# For testing on your own computer with `npx decap-server`
local_backend: true

site_url: https://footydailynetwork.com
display_url: https://footydailynetwork.com
logo_url: /assets/img/2025/08/footydaily-network-1.jpg

media_folder: assets/img/uploads
public_folder: /assets/img/uploads

collections:
  - name: stories
    label: Stories
    label_singular: Story
    description: Match reports and features. Click "New Story", fill it in, then Publish.
    folder: content/stories
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{date}} · {{league}} · {{title}}"
    sortable_fields: [date, title, league]
    view_filters:
      - { label: MLS, field: league, pattern: "^MLS$" }
      - { label: MLS NEXT Pro, field: league, pattern: "MLS NEXT Pro" }
      - { label: NWSL, field: league, pattern: NWSL }
      - { label: USL, field: league, pattern: "^USL$" }
      - { label: UPSL, field: league, pattern: UPSL }
      - { label: Youth / High School / College, field: league, pattern: "Youth|High School|College" }
    fields:
      - { label: Title, name: title, widget: string, hint: "e.g. Chicago Fire Edge Atlanta United 1–0" }
      - { label: Date, name: date, widget: datetime, format: YYYY-MM-DD, date_format: "MMM D, YYYY", time_format: false, picker_utc: true }
      - label: League
        name: league
        widget: select
        default: MLS
        options: [MLS, MLS NEXT Pro, NWSL, USL, U.S. Open Cup, Concacaf, UPSL, College, High School, Youth, Features]
      - { label: Author, name: author, widget: string, default: "Andrew Khai" }
      - { label: Cover photo, name: cover, widget: image, hint: "The big photo at the top of the story and on the homepage." }
      - { label: Story, name: body, widget: markdown, buttons: [bold, italic, link, heading-two, bulleted-list, numbered-list, quote], editor_components: [image] }
      - label: Match gallery
        name: gallery
        widget: image
        required: false
        media_library: { allow_multiple: true, config: { multiple: true } }
        hint: "Pick or upload as many photos as you like — hold Shift or Cmd to select several."
      - { label: Short summary (optional), name: excerpt, widget: text, required: false, hint: "Shown on story cards. Leave blank to use the first lines of the story." }
      - { label: Tags (optional), name: tags, widget: list, required: false }
      - { label: Hide from site (draft), name: draft, widget: boolean, default: false, required: false }
      - { label: Old URL, name: old_url, widget: hidden, required: false }

  - name: pages
    label: Site pages
    files:
      - name: founders
        label: Founders
        file: content/founders.yml
        fields:
          - label: Founders
            name: founders
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Role, name: role, widget: string, default: Co-Founder }
              - { label: Instagram handle (no @), name: handle, widget: string }
              - { label: Photo, name: photo, widget: image }
              - { label: Bio, name: bio, widget: text, hint: "Leave a blank line between paragraphs." }
      - name: photos
        label: Photos page
        file: content/photos.yml
        fields:
          - label: Photos
            name: photos
            widget: image
            media_library: { allow_multiple: true, config: { multiple: true } }
            hint: "The gallery on the Photos page (first 12 also show on the homepage)."
